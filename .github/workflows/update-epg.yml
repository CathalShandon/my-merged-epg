name: Update merged EPG
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge EPG sources
        env:
          PRIVATE_EPG_URL: ${{ secrets.PRIVATE_EPG_URL }}
        run: python merge_epg.py
      - name: Publish if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merged_epg.xml.gz
          if ! git diff --cached --quiet; then
            git commit -m "Update merged EPG"
            git push
          fi
